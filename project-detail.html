<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Kenari Art Exhibition project detail">
<title>Project — KENARI ART EXHIBITION</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="project-detail-page">
<header class="site-header">
  <a class="brand" href="index.html#home"><img src="assets/kenari-art-logo.jpg" alt="Kenari Art"><span>KENARI ART</span></a>
  <nav class="main-nav project-nav"><a href="index.html#about">ABOUT</a><a href="index.html#services">OUR SERVICE</a><a href="index.html#clients">OUR CLIENTS</a><a href="index.html#projects">PROJECTS</a><a href="index.html#contact">CONTACT</a></nav>
</header>
<main>
  <section class="detail-hero"><div class="container"><a class="back-link" href="index.html#projects">← BACK TO PROJECTS</a><span id="detailCategory" class="eyebrow"></span><h1 id="detailTitle"></h1><p id="detailIntro"></p></div></section>
  <section class="detail-gallery-section"><div class="container">
    <div class="detail-main-image"><img id="detailMainImage" src="" alt=""></div>
    <div class="gallery-controls"><button id="prevPhoto" aria-label="Foto sebelumnya">←</button><span id="galleryCount">01 / 05</span><button id="nextPhoto" aria-label="Foto berikutnya">→</button></div>
    <div class="detail-thumbs" id="detailThumbs"></div>
  </div></section>
  <section class="detail-info"><div class="container detail-info-grid"><div><span class="eyebrow">PROJECT INFORMATION</span><h2 id="detailInfoTitle"></h2></div><div><p id="detailDescription"></p><a class="outline-button dark-button" href="index.html#contact">DISCUSS THIS PROJECT <span>→</span></a></div></div></section>
</main>
<footer><div class="container footer-inner"><span>© 2026 KENARI ART EXHIBITION</span><a href="index.html#projects">ALL PROJECTS ↑</a></div></footer>
<script>
const projects = [
  {id:1, name:'NEO', slug:'neo'},
  {id:2, name:'AISHOW', slug:'aishow'},
  {id:3, name:'HUT 67', slug:'hut67'},
  {id:4, name:'IFEX', slug:'ifex'},
  {id:5, name:'IFFINA', slug:'iffina'},
  {id:6, name:'MBLOCK H', slug:'mblockH'},
  {id:7, name:'INTERPOSE', slug:'interpose'},
  {id:8, name:'INAGRITECH', slug:'inagritech'},
  {id:9, name:'HUT 66', slug:'hut66'},
  {id:10, name:'INTERPOSERESO', slug:'interposereso'},
  {id:11, name:'MBLOCK U', slug:'mblockU'},
  {id:12, name:'FESTIVAL', slug:'festival'}
].map(p => {
  const base = `assets/projects/${p.slug}/`;
  const files = {
    neo:['neo01.jpg','neo02.jpg','neo03.jpg','neo04.jpg','neo05.jpg'],
    aishow:['aishow01.jpg','aishow02.jpg','aishow03.jpg','aishow04.jpg'],
    hut67:['hut6701.jpg','hut6702.jpg','hut6703.jpg','hut6704.jpg','hut6705.jpg','hut6706.jpg','hut6707.jpg','hut6708.jpg'],
    ifex:['ifex01.jpg','ifex02.jpg','ifex03.jpg','ifex04.jpg'],
    iffina:['iffina01.jpg','iffina02.jpg','iffina03.jpg'],
    mblockH:['mblockH01.jpg','mblockH02.jpg','mblockH03.jpg','mblockH04.jpg'],
    interpose:['interpose01.jpg','interpose02.jpg','interpose03.jpg','interpose04.jpg','interpose05.jpg'],
    inagritech:['inagritech01.jpg','inagritech02.jpg','inagritech03.jpg'],
    hut66:['hut6601.jpg','hut6602.jpg','hut6603.jpg','hut6604.jpg','hut6605.jpg','hut6606.jpg','hut6607.jpg','hut6608.jpg','hut6609.jpg','hut6610.jpg'],
    interposereso:['interposereso01.jpg','interposereso02.jpg','interposereso03.jpg','interposereso04.jpg','interposereso05.jpg','interposereso06.jpg','interposereso07.jpg','interposereso08.jpg'],
    mblockU:['mblockU01.jpg'],
    festival:['festival01.jpg','festival02.jpg','festival03.jpg']
  }[p.slug];
  return {
    id:p.id, category:'PROJECT', title:p.name,
    intro:p.name, description:'Selected exhibition work.',
    images:files.map(file => base + file)
  };
});
const params=new URLSearchParams(location.search); const index=Math.max(0,Math.min(19,(parseInt(params.get('project'),10)||1)-1)); const p=projects[index];
document.title=p.title+' — KENARI ART EXHIBITION';
document.getElementById('detailCategory').textContent=p.category;
document.getElementById('detailTitle').textContent=p.title;
document.getElementById('detailIntro').textContent=p.intro;
document.getElementById('detailInfoTitle').textContent=p.title;
document.getElementById('detailDescription').textContent=p.description;
const main=document.getElementById('detailMainImage'), thumbs=document.getElementById('detailThumbs'), count=document.getElementById('galleryCount'); let current=0;
function show(n){current=(n+p.images.length)%p.images.length; main.src=p.images[current]; main.alt=p.title+' photo '+(current+1); count.textContent=String(current+1).padStart(2,'0')+' / '+String(p.images.length).padStart(2,'0'); [...thumbs.children].forEach((el,i)=>el.classList.toggle('active',i===current));}
p.images.forEach((src,i)=>{const b=document.createElement('button');b.className='detail-thumb';b.innerHTML=`<img src="${src}" alt="${p.title} thumbnail ${i+1}">`;b.onclick=()=>show(i);thumbs.appendChild(b);});
document.getElementById('prevPhoto').onclick=()=>show(current-1);document.getElementById('nextPhoto').onclick=()=>show(current+1);show(0);
</script>
</body>
</html>
